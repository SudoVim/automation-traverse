name: Release to PyPi
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Restore Cache
        uses: actions/cache@v3
        id: cache
        with:
          path: /home/runner/.local/share/virtualenvs
          key: ${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/Pipfile.lock') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --dev
          pipx install twine

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: |
          pipenv run bump2version ${{ inputs.version }}

      - name: Build package
        run: pipenv run python -m build

      - name: Push version bump + tags
        run: git push --follow-tags

      - name: Create GitHub Release
        run: gh release create $(git describe --tags --abbrev=0) --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
