[project]
name = "automation-traverse"
version = "1.0.0"
authors = [
  { name="Michael Renken", email="michaelarenken@gmail.com" },
]
description = "Automate tasks in graph format"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "automation-entities>=1.0.0",
    "colorama>=0.4.6",
    "types-colorama>=0.4.15.20260508",
]

[project.urls]
Homepage = "https://github.com/SudoVim/automation-traverse"
Issues = "https://github.com/SudoVim/automation-traverse/issues"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "black>=26.10.1",
    "build>=1.6.1",
    "bump2version>=1.0.1",
    "isort>=9.0.2",
    "pytest-cov>=7.1.0",
    "sphinx>=8.1.3",
    "twine>=7.0.0",
]
